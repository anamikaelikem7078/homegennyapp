# Codemagic builds for the iOS app (codemagic.io — builds on a cloud Mac).
#
# ios-unsigned   : works without an Apple Developer account. Produces an
#                  unsigned IPA that proves the app compiles for iOS; it can
#                  be sideloaded (Sideloadly / AltStore re-sign it with a
#                  free Apple ID, valid 7 days).
# ios-testflight : needs the Apple Developer Program account, the App ID
#                  com.homegenny.app, and an App Store Connect API key added
#                  in Codemagic (Teams → Integrations) under the name below.

workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: |
          flutter --version
          cd ios
          pod install --repo-update || {
            echo "Flutter pod needs iOS: $(grep deployment_target Flutter/Flutter.podspec)"
            echo "Podfile platform:      $(grep '^platform' Podfile)"
            exit 1
          }
      - name: Build iOS (no code signing)
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qr homegenny-unsigned.ipa Payload
    artifacts:
      - build/ios/unsigned/homegenny-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: HomeGenny App Store Connect key
    environment:
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.homegenny.app
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: |
          flutter --version
          cd ios
          pod install --repo-update || {
            echo "Flutter pod needs iOS: $(grep deployment_target Flutter/Flutter.podspec)"
            echo "Podfile platform:      $(grep '^platform' Podfile)"
            exit 1
          }
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
