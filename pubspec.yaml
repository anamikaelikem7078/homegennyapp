name: homegennyapp
description: HomeGenny - Production-ready Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.0
  local_auth: ^2.3.0
  intl: ^0.20.2
  equatable: ^2.0.7
  jwt_decoder: ^2.0.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.6
  flutter_screenutil: ^5.9.3
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/json/staff/
    - assets/json/rm/
    - assets/json/client/
